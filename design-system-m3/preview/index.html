<script>
const GROUPS=[['Foundation',[['foundation',' Foundation 总览','◈']]],['Design Tokens',[['tokens-color','色彩角色','◐'],['tokens-type','Typography 15 角色','Aa'],['tokens-shape','Spacing / Shape / Motion','▱'],['contexts','上下文与缺口','⌘']]],['Patterns & Delivery',[['patterns','页面与 AI Patterns','▤'],['governance','治理与资产清单','✓']]]];
const state={};let components=[];let patterns=[];let templates;
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pill=s=>`<span class="pill ${esc(s)}">${esc(s)}</span>`;
async function load(){
  try{
    const files=['foundation.json','metadata.json','tokens/tokens.json','components/components.json','patterns/patterns.json'];
    const responses=await Promise.all(files.map(f=>fetch('../'+f)));responses.forEach((r,i)=>{if(!r.ok)throw new Error(files[i]+' · HTTP '+r.status)});
    [state.foundation,state.meta,state.tokens,state.componentData,state.patternData]=await Promise.all(responses.map(r=>r.json()));
    components=state.componentData.components;patterns=state.patternData.patterns;
    $('#version-pill').textContent='v'+state.meta.version;
    const tr=await fetch('../components/components.html');if(!tr.ok)throw new Error('组件模板加载失败 · HTTP '+tr.status);
    templates=new DOMParser().parseFromString(await tr.text(),'text/html');
    buildNav();route();
  }catch(e){$('#main').innerHTML=`<div class="error-box"><b>资产加载失败</b>\n${esc(e.message)}\n\n请通过 HTTP 服务打开本页，而不是 file://。</div>`}
}
function buildNav(){
  let html=GROUPS.map(([title,items])=>`<section class="nav-group"><div class="nav-title">${title}</div>${items.map(([id,name,ico])=>`<button class="nav-item" data-route="${id}"><span class="nav-ico">${ico}</span>${name}</button>`).join('')}</section>`).join('');
  ['Actions','Inputs','Navigation','Content','Feedback','Selection / Utility'].forEach(group=>{
    const list=components.filter(c=>c.group===group);if(!list.length)return;
    html+=`<section class="nav-group"><div class="nav-title">${group}</div>${list.map(c=>`<button class="nav-item" data-route="component/${c.slug}"><span class="nav-ico">▪</span>${c.name}<span class="mini-id">${c.priority}</span></button>`).join('')}</section>`;
  });$('#nav').innerHTML=html;
}
function route(){
  const hash=location.hash.slice(1)||'foundation';const [kind,slug]=hash.split('/');
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.route===hash));
  $('#sidebar').classList.remove('open');
  if(kind==='component'){const c=components.find(x=>x.slug===slug);if(c)return renderComponent(c)}
  if(kind==='pattern'){const p=patterns.find(x=>x.id===slug);if(p)return renderPattern(p)}

}

  <section class="hero-panel"><div class="eyebrow">AI-NATIVE DESIGN SYSTEM · CONTRAST BUILD</div><h2>不是换一套组件皮肤，<br>而是把原则、行为与真实业务状态一起收编。</h2><p>Reference → System → Component → UI 全链路追溯；每个核心组件都有八项规格。未实现的深色模式、完整 A11y 与多窗口适配不会被包装成完成。</p><div class="stats"><div class="stat"><b>${state.meta.counts.principles}</b><span>产品原则</span></div><div class="stat"><b>${state.meta.counts.typographyRoles}</b><span>复合排版角色</span></div><div class="stat"><b>${components.length}</b><span>前后台真实组件</span></div><div class="stat"><b>${patterns.length}</b><span>页面 / AI Patterns</span></div><div class="stat"><b>${state.meta.counts.adminRoutes}</b><span>后台业务路由</span></div></div></section>
  <section class="section"><div class="section-head"><h2>原则追溯</h2><p>每条原则都有下游落点与真实状态</p></div><div class="grid-3">${f.principles.map(p=>`<article class="card principle"><div class="principle-top"><span class="principle-id">${p.id}</span><h3>${p.name}</h3>${p.status?pill(p.status):''}</div><p>${esc(p.evidence)}</p><div class="downstream">${p.downstream.map(x=>`<span class="token-chip">${x}</span>`).join('')}</div></article>`).join('')}</div></section>
  <section class="section"><div class="section-head"><h2>语义核心</h2><p>视觉值不再孤立存在</p></div><div class="chain">${[['Reference','真实原始值'],['System','语义角色与配对'],['Component','组件槽位与八项规格'],['UI','同源模板实况']].map((n,i)=>`${i?'<div class="chain-arrow">→</div>':''}<div class="card chain-node"><b>${n[0]}</b><span>${n[1]}</span></div>`).join('')}</div></section>

function renderColors(){
  const colors=state.tokens.reference.colorFamilies;const roles=[['primary','--sys-color-primary'],['on-primary','--sys-color-on-primary'],['primary-container','--sys-color-primary-container'],['on-primary-container','--sys-color-on-primary-container'],['secondary','--sys-color-secondary'],['tertiary','--sys-color-tertiary'],['surface','--sys-color-surface'],['on-surface','--sys-color-on-surface'],['surface-container','--sys-color-surface-container'],['on-surface-variant','--sys-color-on-surface-variant'],['outline','--sys-color-outline'],['inverse-surface','--sys-color-inverse-surface'],['success','--sys-color-success'],['warning','--sys-color-warning'],['info','--sys-color-info'],['error','--sys-color-error']];
  $('#main').innerHTML=head('色彩角色','Reference 只记录真实色值；System 按用途定岗并保持前景—背景配对。','<span class="pill review">TOK-001 review</span>','Design Tokens')+`<div class="notice"><span>⚠</span><div><b>coral 一色两义未擅自修正</b>真实项目同时把它用于 FAB 品牌行动和 danger/error。这里保留事实并挂产品裁决，不用“美化”掩盖冲突。</div></div><section class="section"><div class="section-head"><h2>Reference 色族</h2><p>来自页面与旧 Token 的真实数值</p></div><div class="card pad">${Object.entries(colors).map(([name,values])=>`<div class="family"><div class="family-head"><b>${name}</b><code>${values.length} observed values</code></div><div class="swatches">${values.map(v=>`<div class="swatch" style="background:${v};color:${luma(v)>.63?'#302C63':'#fff'}">${v}</div>`).join('')}</div></div>`).join('')}</div></section><section class="section"><div class="section-head"><h2>System 角色</h2><p>颜色只按用途命名</p></div><div class="role-grid">${roles.map(([n,v])=>`<div class="role-card"><div class="role-dot" style="background:var(${v})"></div><code>${v}</code><small>${n}</small></div>`).join('')}</div></section>`;
}
function luma(hex){const a=hex.replace('#','').match(/.{2}/g).map(x=>parseInt(x,16)/255).map(x=>x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4));return .2126*a[0]+.7152*a[1]+.0722*a[2]}
function renderType(){
  const roles=state.tokens.typography.roles;const samples={display:'把智慧请上桌',headline:'发起一场圆桌',title:'每位老友都有思维内核',body:'每个欲望，都是你跟不快乐签的一份合同。',label:'深度圆桌 · 三轮交锋'};
  $('#main').innerHTML=head('Typography · 15 个复合角色','每个角色同时绑定字体、字号、行高、字重和字距；不是把字号单独抽出来就算 Token。','<span class="pill observed">5 × 3 baseline</span>','Design Tokens')+`<section class="card">${Object.entries(roles).map(([name,r])=>{const [family]=name.split('-');return `<div class="type-row"><div class="type-name"><b>${name}</b><code>${r.source}</code></div><div class="type-demo" style="font-family:var(--sys-type-${name}-font);font-size:var(--sys-type-${name}-size);line-height:var(--sys-type-${name}-line);font-weight:var(--sys-type-${name}-weight);letter-spacing:var(--sys-type-${name}-tracking)">${samples[family]}</div><div class="type-meta">${r.font} · ${r.size}px / ${r.lineHeight}<br>weight ${r.weight}</div></div>`}).join('')}</section>`;
}
function renderShape(){
  const spaces=state.tokens.reference.spacingBaseline;const shapes=[['8','8px'],['12','12px'],['16','16px'],['22','22px'],['28','28px'],['36','36px'],['pill','999px'],['jelly','46% 54% 52% 48%/52% 46% 54% 48%']];
  $('#main').innerHTML=head('Spacing / Shape / Motion','有限刻度与使用分工来自真实页面；Expressive 动效仍受 Reduced Motion 约束。','<span class="pill observed">4pt baseline</span>','Design Tokens')+`<div class="grid-2"><section class="card pad"><div class="section-head"><h2>Spacing</h2><p>Padding / Gap 优先</p></div>${spaces.map(s=>`<div class="spacing-row"><code>space-${s*25}</code><div class="spacing-bar" style="width:${s*4}px"></div><span>${s}px</span></div>`).join('')}</section><section class="card pad"><div class="section-head"><h2>Shape</h2><p>基础形状与 jelly 分离</p></div><div class="shape-grid">${shapes.map(([n,v])=>`<div class="shape-item"><div class="shape-box" style="border-radius:${v}">${n}</div>${v}</div>`).join('')}</div></section></div><section class="section grid-3"><article class="card principle"><h3>Feedback</h3><p>.15s / Spring easing<br>按钮、Chip、TAB 与 FAB 的即时操作反馈。</p></article><article class="card principle"><h3>Enter</h3><p>.3s / Standard easing<br>消息、Toast 与表面进入。</p></article><article class="card principle"><h3>Ambient</h3><p>.5s+ / observed keyframes<br>Mascot float、Progress shimmer；系统 Reduced Motion 已观察。</p></article></section>`;
}
function renderContexts(){
  const ctx=state.tokens.contexts;
  $('#main').innerHTML=head('上下文与缺口','Theme、Viewport 和 RTL 走不同处理路径；没有实现的能力明确标缺口。','<span class="pill missing">dark missing</span>','Design Tokens')+`<div class="card"><table class="data-table"><thead><tr><th>Context</th><th>状态</th><th>真实证据 / 处理路径</th></tr></thead><tbody>${Object.entries(ctx).map(([n,v])=>`<tr><td><b>${n}</b></td><td>${pill(v.status)}</td><td>${esc(v.source||v.evidence||v.breakpoint||'未实现，未生成映射')}</td></tr>`).join('')}</tbody></table></div><section class="section notice info"><span>ⓘ</span><div><b>不复制组件来做深色模式</b>未来 Theme / Contrast 应只覆盖 System Token；Viewport 由 Layout / Pattern 重组；RTL 由逻辑方向与 Behavior 承担。</div></section>`;
}
function renderPatterns(){
  $('#main').innerHTML=head('页面与 AI Patterns','组件之外，继续提取任务流、页面生命周期、AI 不确定性和恢复路径。',`<span class="pill observed">${patterns.length} observed patterns</span><span class="pill">${patterns.filter(p=>p.surface==='admin').length} admin</span>`,'Patterns')+`<div class="pattern-grid">${patterns.map(p=>`<button class="card pattern-card" data-route="pattern/${p.id}"><span class="token-chip">${p.id}</span>${p.surface==='admin'?'<span class="pill">admin</span>':''}<h3>${p.name}</h3><p>${p.layout}</p>${p.route?`<p>Route · ${esc(p.route)}</p>`:''}<div class="downstream">${Object.keys(p.lifecycle).slice(0,5).map(x=>`<span class="pill">${x}</span>`).join('')}</div></button>`).join('')}</div><section class="section"><div class="section-head"><h2>五档窗口尺寸类</h2><p>不伪造响应式覆盖</p></div><div class="card"><table class="data-table"><tbody>${Object.entries(state.patternData.windowClasses).map(([n,v])=>`<tr><td><b>${n}</b></td><td>${pill(v.status)}</td><td>${esc(v.rule||'未单独定义')}</td></tr>`).join('')}</tbody></table></div></section>`;
}
function renderPattern(p){
  $('#main').innerHTML=head(p.name,`${p.id} · ${p.layout}${p.route?' · Route: '+p.route:''}`,`${pill(p.priority)}${p.surface?pill(p.surface):''}`,'Patterns')+`<div class="grid-2"><section class="card pad"><div class="section-head"><h2>Anatomy</h2></div><ul>${p.anatomy.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="source-line">${esc(p.source)}<br>${esc(p.evidence)}</div></section><section class="card pad"><div class="section-head"><h2>Behavior / AI 契约</h2></div><ul>${(p.behavior||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${p.uncertainty?`<p><b>不确定性：</b>${esc(p.uncertainty)}</p>`:''}${p.dataAwareness?`<p><b>数据感知：</b>${esc(p.dataAwareness)}</p>`:''}${p.gaps?`<div class="notice error">${p.gaps.map(esc).join('<br>')}</div>`:''}</section></div><section class="section"><div class="section-head"><h2>Lifecycle</h2><p>不是只交付成功态</p></div><div class="lifecycle">${Object.entries(p.lifecycle).map(([n,v])=>`<article class="card life-item"><b>${n}</b><p>${esc(v)}</p></article>`).join('')}</div></section>`;
}
function renderComponent(c){
  const tpl=templates.querySelector(`template[data-component="${c.slug}"]`);if(!tpl){$('#main').innerHTML='<div class="error-box">模板缺失：'+esc(c.slug)+'</div>';return}
  const labels={variants:'变体',configurations:'配置',anatomy:'结构',states:'状态适用矩阵',behavior:'行为',a11y:'无障碍',measurements:'测量',tokens:'Token 绑定'};
  $('#main').innerHTML=head(c.name,`${c.id} · ${c.group} · ${c.priority}`,`${pill(c.priority)}<span class="pill experimental">experimental / unwired</span>`,c.group)+`<div class="component-layout ${c.surface==='admin'?'admin-layout':''}"><section class="card live-card"><div class="live-head"><span class="pill observed">UI 实况</span><span>同源 template · 非截图</span></div><div class="live-canvas" id="live-canvas"></div><details class="source-details"><summary>查看提取的 HTML 骨架</summary><pre class="source-code">${esc(tpl.innerHTML.trim())}</pre></details><div class="source-line">生产证据：${esc(c.source)}<br>实现状态：${esc(c.implementation.consumers)}</div></section><section class="spec-list">${state.componentData.specContract.map((key,i)=>`<details class="card spec-item" ${i<2?'open':''}><summary class="spec-summary"><span class="spec-num">${String(i+1).padStart(2,'0')}</span><h3>${labels[key]}</h3><span class="en">${key}</span></summary><div class="spec-body">${renderValue(c[key],key)}</div></details>`).join('')}</section></div>`;
  $('#live-canvas').appendChild(tpl.content.cloneNode(true));
}
function renderValue(v,key){
  if(Array.isArray(v))return `<ul>${v.map(x=>`<li>${typeof x==='object'?`<div class="variant"><b>${esc(x.name||x.id||'item')}</b> ${x.provenance?pill(x.provenance):''}<p>${esc(x.evidence||JSON.stringify(x))}</p></div>`:esc(x)}</li>`).join('')}</ul>`;
  if(v&&typeof v==='object')return `<dl class="kv">${Object.entries(v).map(([k,val])=>`<dt>${esc(k)}</dt><dd>${Array.isArray(val)?val.map(esc).join('<br>'):typeof val==='object'?esc(JSON.stringify(val)):esc(val)}</dd>`).join('')}</dl>`;
  return esc(v);
}
function renderGovernance(){
  const m=state.meta;
  $('#main').innerHTML=head('治理与资产清单','稳定 ID、生命周期、变更门禁和已知问题统一登记；这不是已发布稳定版。','<span class="pill experimental">experimental</span>','Delivery & Governance')+`<div class="grid-2">${m.governanceFindings.map(f=>`<article class="card finding"><div class="finding-head"><code>${f.id}</code>${pill(f.severity)}</div><h3>${f.title}</h3><p>${f.detail}</p></article>`).join('')}</div><section class="section"><div class="section-head"><h2>交付资产</h2><p>全部位于独立 design-system-m3</p></div><div class="card"><table class="data-table"><thead><tr><th>资产</th><th>路径</th></tr></thead><tbody>${Object.entries(m.assets).map(([k,v])=>`<tr><td>${k}</td><td><code>${v}</code></td></tr>`).join('')}</tbody></table></div></section><section class="section notice info"><span>✓</span><div><b>旧版与生产页面未被修改</b>本对照版不使用 pipeline 提取脚本，不回接页面，不覆盖原 design-system。变更进入稳定版前仍需源码证据、八项规格、浏览器视觉复核与缺口登记。</div></section>`;
}
document.addEventListener('click',e=>{
  const nav=e.target.closest('[data-route]');if(nav){location.hash=nav.dataset.route;return}
  const scope=e.target.closest('#live-canvas');if(!scope)return;
  const chip=e.target.closest('.chip');if(chip){chip.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===chip));demoToast();return}
  const filter=e.target.closest('.filters button');if(filter){filter.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===filter));demoToast();return}
  const adminNav=e.target.closest('.admin-nav-demo .nav-item');if(adminNav){adminNav.parentElement.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('on',x===adminNav));demoToast();return}
  const sw=e.target.closest('.sw');if(sw){sw.classList.toggle('on');demoToast();return}
  const mode=e.target.closest('.mode');if(mode){mode.parentElement.querySelectorAll('.mode').forEach(x=>x.classList.toggle('on',x===mode));demoToast();return}
  const tab=e.target.closest('.tab');if(tab){tab.parentElement.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===tab));demoToast();return}
  if(e.target.closest('button'))demoToast();
});
let toastTimer;function demoToast(){const t=$('#demo-toast');t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),1600)}
$('#mobile-menu').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));window.addEventListener('hashchange',route);load();
