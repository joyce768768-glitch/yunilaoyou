<!DOCTYPE html>

<!-- 登录鉴权 -->
<div id="login" class="login">

    <h1 class="lg-title">与你老友 · 管理后台</h1>
    <p class="lg-sub">请使用管理员账号登录</p>
    <form onsubmit="tryLogin(event)" novalidate>
      <div class="lg-field"><span>👤</span><input id="lg-user" placeholder="管理员账号" autocomplete="username"></div>
      <div class="lg-field"><span>🔒</span><input id="lg-pwd" type="password" placeholder="密码" autocomplete="current-password"></div>
      <p class="lg-err" id="lg-err"></p>
      <button class="btn btn-primary lg-btn" type="submit">登录后台</button>
    </form>
    <p class="lg-tip">演示环境 · 账号 <b>admin</b> · 密码 <b>admin888</b></p>
    <p class="lg-back"><a href="../index.html">← 返回官网</a></p>
  </div>
</div>

<div class="layout" id="app" hidden>
  <!-- 侧栏 -->
  <aside class="side">
    <a class="logo" href="#/dashboard">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" width="20" height="20"><circle cx="9" cy="9" r="4.4" fill="#FFF7EA"/><circle cx="15.5" cy="14.5" r="4.4" fill="#FFB930" opacity=".92"/><circle cx="10.5" cy="15.5" r="2.2" fill="#FF8FB8"/></svg></span>
      <span><b>与你老友</b><small>ADMIN CONSOLE</small></span>
    </a>
    <a class="nav-item on" data-r="dashboard" href="#/dashboard"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"/><path d="M12 12l3.4-3.4"/><path d="M12 3.4v2M12 18.6v2M3.4 12h2M18.6 12h2"/></svg></span><span>数据总览</span></a>

<!-- 详情抽屉 -->
<div class="veil" id="veil" onclick="closeDrawer()"></div>
